services:
  servarr-mcp:
    image: ghcr.io/carldog/servarr-mcp:latest
    pull_policy: always
    container_name: servarr-mcp
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3002}:3000"
    # When the *arr apps run on the same host as this container, the
    # container's DNS context can't resolve the host's own hostname
    # (e.g. `my-nas`). Setting host.docker.internal → host-gateway lets
    # us point *_URL env vars at http://host.docker.internal:<port>.
    # Harmless when the deps are off-host — the alias is just unused.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      MCP_PORT: "3000"
      # Recommended on any non-fully-trusted network — see CLAUDE.md
      # "Transport modes" for what each does. Both default to open
      # (with a logged warning) when unset.
      MCP_AUTH_TOKEN: "${MCP_AUTH_TOKEN:-}"
      MCP_ALLOWED_HOSTS: "${MCP_ALLOWED_HOSTS:-}"
      # Idle-session eviction threshold (default 30 min). The code has always
      # read this, but it was missing here — so it read as configurable and
      # silently wasn't (docker-deployments.md §10). Tunable from Portainer.
      MCP_SESSION_IDLE_MS: "${MCP_SESSION_IDLE_MS:-1800000}"
      SONARR_URL: "${SONARR_URL:-}"
      SONARR_API_KEY: "${SONARR_API_KEY:-}"
      RADARR_URL: "${RADARR_URL:-}"
      RADARR_API_KEY: "${RADARR_API_KEY:-}"
      LIDARR_URL: "${LIDARR_URL:-}"
      LIDARR_API_KEY: "${LIDARR_API_KEY:-}"
      READARR_URL: "${READARR_URL:-}"
      READARR_API_KEY: "${READARR_API_KEY:-}"
      PROWLARR_URL: "${PROWLARR_URL:-}"
      PROWLARR_API_KEY: "${PROWLARR_API_KEY:-}"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
