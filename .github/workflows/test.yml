name: Test

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Docs-only changes can't affect the image, tests, or lint (build
    # context is just the app source + Dockerfile). Skipping them avoids
    # both wasted CI minutes and republishing :latest, which would
    # otherwise force-pull + bounce the auto-deploying stack for a pure
    # documentation commit.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".vscode/**"
      - ".env.example"
      - ".gitattributes"
  pull_request:
    branches: [main]

env:
  # node 22 ships npm 10.9.8. A newer local npm is lenient about a lockfile
  # this npm rejects, so pin both sides (here + package.json "packageManager")
  # to keep local == CI. See claude-fleet-kit fleet/lessons/npm-version-skew.
  PINNED_NPM: "10.9.8"
jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Pin npm (match local — see lessons/npm-version-skew)
        run: npm install --global "npm@${{ env.PINNED_NPM }}"

      # Using `npm install` rather than `npm ci` because the lockfile is
      # generated on Windows and missing some Linux/macOS-specific
      # optional binary peers (e.g. @emnapi/* under @rollup/rollup-*).
      # `npm ci` is strict and fails on those cross-platform gaps.
      - name: Install dependencies
        run: npm install --prefer-offline --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

  quality:
    name: lint + format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Pin npm (match local — see lessons/npm-version-skew)
        run: npm install --global "npm@${{ env.PINNED_NPM }}"

      # Using `npm install` rather than `npm ci` because the lockfile is
      # generated on Windows and missing some Linux/macOS-specific
      # optional binary peers (e.g. @emnapi/* under @rollup/rollup-*).
      # `npm ci` is strict and fails on those cross-platform gaps.
      - name: Install dependencies
        run: npm install --prefer-offline --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

  build-and-push:
    name: Build and push Docker image
    # Runs on push (branch or tag) AND pull_request — a PR still validates
    # the image builds, it just doesn't push (see the `push:` step input
    # below). This is the fix for UNI-14: previously a separate
    # docker-publish.yml had no `needs:` at all, so a red test/quality run
    # could still ship :latest to ghcr.io on every push to main
    # (gh run list showed three unstopped publishes on the day this was
    # filed).
    needs: [test, quality]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=main-,format=short,enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # amd64 only. Every deployment target is x86-64 (the containers
          # run as Portainer stacks on an amd64 host); nothing in the fleet
          # runs on ARM, so a QEMU-emulated arm64 build is ~5x slower for an
          # image no one pulls. Re-add linux/arm64 here if an ARM host ever
          # joins the fleet. See lessons/docker-multiarch-only-what-you-deploy.
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
