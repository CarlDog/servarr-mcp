name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # Using `npm install` rather than `npm ci` because the lockfile is
      # generated on Windows and missing some Linux/macOS-specific
      # optional binary peers (e.g. @emnapi/* under @rollup/rollup-*).
      # `npm ci` is strict and fails on those cross-platform gaps.
      - name: Install dependencies
        run: npm install --prefer-offline --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

  quality:
    name: lint + format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # Using `npm install` rather than `npm ci` because the lockfile is
      # generated on Windows and missing some Linux/macOS-specific
      # optional binary peers (e.g. @emnapi/* under @rollup/rollup-*).
      # `npm ci` is strict and fails on those cross-platform gaps.
      - name: Install dependencies
        run: npm install --prefer-offline --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check
